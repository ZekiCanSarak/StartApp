<article class="job-post card hover-lift">
    <div class="job-post-top">
        <span class="job-icon"><i class="fas fa-briefcase"></i></span>
        {% if job.date %}<span class="muted job-date">{{ job.date }}</span>{% endif %}
    </div>
    <h3>{{ job.title }}</h3>
    <p>{{ job.description }}</p>
    {% if job.username %}<p class="job-poster">Posted by <strong>{{ job.username }}</strong></p>{% endif %}
    <a href="{{ job.url }}" target="_blank" rel="noopener">Apply now <i class="fas fa-arrow-right"></i></a>
</article>
